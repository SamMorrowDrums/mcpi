name: Validate release metadata

# npm publication and its sole npm-publish approval are owned by
# build-binaries.yml. This workflow performs only lightweight tag checks.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-metadata-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_REF: ${{ github.sha }}
    steps:
      - name: Checkout reviewed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate release tag and source commit
        run: node scripts/release-guard.mjs --tag "${RELEASE_TAG}" --source-ref "${SOURCE_REF}"

      - name: Validate generated install metadata
        run: |
          node scripts/generate-coding-agent-shrinkwrap.mjs --check
          node scripts/generate-coding-agent-install-lock.mjs --check
